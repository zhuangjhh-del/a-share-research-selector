<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A 股研究选股</title><style>body{margin:0;background:#f7f8fa;color:#1d2733;font:16px system-ui,-apple-system,"Microsoft YaHei",sans-serif}.wrap{max-width:960px;margin:auto;padding:36px 20px}.card{background:#fff;border:1px solid #e5e8eb;border-radius:12px;padding:20px;margin:18px 0}.muted{color:#657280}.warn{color:#9a5d00;background:#fff5d8;padding:12px;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{padding:12px 8px;border-bottom:1px solid #edf0f2;text-align:left}</style></head><body><main class="wrap"><h1>A 股研究选股</h1><p class="muted">Tushare 数据模式 · 不构成投资建议</p><section class="card"><h2 id="date">加载中</h2><p id="updated" class="muted"></p><p id="message" class="warn"></p><p id="strategy"></p><table><thead><tr><th>代码</th><th>名称</th><th>评分</th><th>入选原因</th></tr></thead><tbody id="rows"></tbody></table></section><section class="card"><h2>数据状态</h2><p id="source"></p><p class="muted">每个交易日北京时间 14:35 执行。Tushare Token 与所需盘中权限验证完成后，才会发布推荐结果。</p></section><section class="card"><h2>历史记录</h2><div id="history" class="muted"></div></section></main><script>async function get(p){const r=await fetch(p+'?v='+Date.now());if(!r.ok)throw Error();return r.json()}Promise.all([get('data/latest.json'),get('data/history.json')]).then(([d,h])=>{date.textContent=d.asOf+' 选股结果';updated.textContent='北京时间：'+d.updatedAt+' · 状态：'+d.status;message.textContent=d.message||'';strategy.textContent='策略 '+d.strategy.version+'：'+d.strategy.description;source.textContent='来源：'+d.source;rows.innerHTML=d.results.map(x=>`<tr><td>${x.code}</td><td>${x.name}</td><td>${x.score}</td><td>${x.reasons.join('；')}</td></tr>`).join('');history.innerHTML=h.map(x=>`${x.asOf} · ${x.count} 只 · ${x.strategyVersion} · ${x.status||'success'}`).join('<br>')}).catch(()=>{message.textContent='暂无可验证数据。'})</script></body></html>
