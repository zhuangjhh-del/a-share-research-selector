<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A 股研究选股</title><style>body{margin:0;background:#f7f8fa;color:#1d2733;font:16px system-ui,-apple-system,"Microsoft YaHei",sans-serif}.wrap{max-width:960px;margin:auto;padding:36px 20px}h1{margin:0 0 6px}.muted{color:#657280}.card{background:#fff;border:1px solid #e5e8eb;border-radius:12px;padding:20px;margin:18px 0}table{width:100%;border-collapse:collapse}td,th{padding:12px 8px;border-bottom:1px solid #edf0f2;text-align:left}th{color:#657280;font-size:13px}.tag{display:inline-block;background:#e8f3ff;color:#075ca8;border-radius:99px;padding:4px 9px;font-size:13px}footer{font-size:13px;color:#657280;margin:30px 0}</style></head><body><main class="wrap"><h1>A 股研究选股</h1><p class="muted">盘后研究工具 · 不构成任何投资建议</p><section class="card"><span class="tag" id="mode">加载中</span><h2 id="date">每日选股结果</h2><p id="updated" class="muted"></p><p id="strategy"></p><table><thead><tr><th>代码</th><th>名称</th><th>评分</th><th>入选原因</th></tr></thead><tbody id="rows"></tbody></table><p id="empty" class="muted"></p></section><section class="card"><h2>筛选条件</h2><p id="rules">加载中</p><p class="muted" id="source"></p></section><section class="card"><h2>历史记录</h2><div id="history" class="muted">加载中</div></section><footer>仅展示策略计算后的衍生结果；不展示实时行情。数据以网站标注的更新时间为准。</footer></main><script>async function get(p){let r=await fetch(p+'?v='+Date.now());if(!r.ok)throw Error();return r.json()}Promise.all([get('data/latest.json'),get('data/history.json')]).then(([d,h])=>{mode.textContent=d.mode;date.textContent=d.asOf+' 选股结果';updated.textContent='更新时间：'+d.updatedAt+' · 状态：成功';strategy.textContent='策略 '+d.strategy.version+'：'+d.strategy.description;source.textContent='数据状态：'+d.source;rows.innerHTML=d.results.map(x=>`<tr><td>${x.code}</td><td>${x.name}</td><td>${x.score}</td><td>${x.reasons.join('；')}</td></tr>`).join('');empty.textContent=d.results.length?'':'当日没有满足全部条件的标的。';history.innerHTML=h.map(x=>`${x.asOf} · ${x.count} 只 · ${x.strategyVersion}`).join('<br>')}).catch(()=>{document.querySelector('main').insertAdjacentHTML('beforeend','<p>暂无可发布结果，请稍后查看运行状态。</p>')})</script></body></html>
